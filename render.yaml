services:
  - type: web
    name: jobsinc-backend
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: if [ -z "$DIRECT_URL" ]; then echo "DIRECT_URL is required for Prisma migrations"; exit 1; fi; npx prisma migrate deploy && node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: 1
      # DIRECT_URL doit être configurée dans le dashboard Render.
