services:
  - type: web
    name: jobsinc-backend
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: 1
