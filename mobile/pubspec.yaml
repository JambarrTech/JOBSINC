name: jobsinc_mobile
description: Application mobile JOBSINC pour candidats et recruteurs.
publish_to: 'none'
version: 1.0.0+1

environment:
  # Aligné sur la contrainte RÉELLE de pubspec.lock (`sdks: dart >=3.12.0
  # <4.0.0`), et non sur le `>=3.3.0` de `flutter create`. L'écart de 9 versions
  # mineures était une promesse fausse : `flutter pub get` échouait avant même
  # l'analyse sur toute machine dont le SDK est entre 3.3 et 3.11 (cf. le
  # commentaire du job `mobile` dans .github/workflows/ci.yml, qui documente le
  # build déjà cassé pour cette raison). On aligne donc le manifeste sur le
  # lockfile, pas l'inverse.
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^11.0.0
  http: ^1.2.2
  http_parser: ^4.1.2
  socket_io_client: ^3.1.2
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  file_picker: ^12.0.0
  intl: ^0.20.2
  url_launcher: ^6.2.6
  cached_network_image: ^3.4.1
  flutter_local_notifications: ^17.2.4
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/illustrations/
