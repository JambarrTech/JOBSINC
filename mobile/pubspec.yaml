name: jobsinc_mobile
description: Application mobile JOBSINC pour candidats et recruteurs.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  shared_preferences: ^2.3.2
  http: ^1.2.2
  http_parser: ^4.1.2
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  file_picker: ^12.0.0
  intl: ^0.20.2
  url_launcher: ^6.2.6
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/illustrations/
