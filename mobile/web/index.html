<!DOCTYPE html><html><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!--
    Description réelle : le placeholder "A new Flutter project." de `flutter
    create` était indexé tel quel par les moteurs de recherche et affiché dans
    le partage de lien / l'aperçu d'installation PWA. Elle annonce donc la
    "marque" Flutter à tous les utilisateurs de l'app installée.
  -->
  <meta name="description" content="JOBSINC : la plateforme de recrutement qui relie candidats et entreprises. Trouvez des offres, suivez vos candidatures et échangez avec les recruteurs.">

  <!-- Couleur de la barre système en mode PWA installée (Android/Chrome).
       Doit refléter AppColors.primary (lib/core/theme/app_colors.dart) : sans
       ce meta, le navigateur en déduit une couleur de son propre thème (souvent
       le blanc par défaut), d'où une barre d'adresse qui jure avec la charte. -->
  <meta name="theme-color" content="#0B5FE0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <!--
    Nom affiché sous l'icône sur l'écran d'accueil iOS. Valait "mobile" (le nom
    du projet `flutter create`) : l'app s'installait donc sous le nom « mobile »
    chez tous les utilisateurs iOS.
  -->
  <meta name="apple-mobile-web-app-title" content="JOBSINC">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>JOBSINC</title>
  <link rel="manifest" href="manifest.json">
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      /* Aligné sur `background_color` du manifest (AppColors.background) et sur
         le fond réel des écrans : le #FFFFFF de `flutter create` produisait un
         écran de saut BLANC suivi immédiatement d'un #F4F7FB, soit un flash
         visible à chaque ouverture. */
      background-color: #F4F7FB;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    @media (prefers-color-scheme: dark) {
      body {
        /* AppColors.navy, et non le #1A1A2E de `flutter create` : le fond
           sombre doit rester dans la charte. */
        background-color: #071D3A;
          }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
  <!--
    Viewport : `maximum-scale=1.0, user-scalable=no` (défaut `flutter create`)
    désactive le pinch-zoom, ce qui viole le critère WCAG 1.4.4 (Resize Text) et
    empêche tout utilisateur ayant une basse vision de grossir l'interface.
    Seul `width=device-width, initial-scale=1` est conservé — exactement comme
    entreprise/app/layout.tsx côté web.
  -->
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
