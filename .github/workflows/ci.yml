name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend — unit + e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobsinc
          POSTGRES_PASSWORD: jobsinc
          POSTGRES_DB: jobsinc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U jobsinc -d jobsinc_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://jobsinc:jobsinc@127.0.0.1:5432/jobsinc_test?schema=public
      JWT_SECRET: ci-secret-de-test-longueur-suffisante-1234567890
      PORT: '5000'
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test
      - name: Démarrage serveur + tests E2E
        run: |
          node server.js &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/api/jobs >/dev/null && break
            sleep 2
          done
          npm run test:e2e

  web:
    name: Frontend — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: entreprise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: entreprise/package-lock.json
      - run: npm ci
      - run: npm run build
