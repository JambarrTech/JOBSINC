name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  deploy-web:
    name: Deploy Web (Vercel)
    runs-on: ubuntu-latest
    if: github.repository == 'JambarrTech/JOBSINC'
    defaults:
      run:
        working-directory: entreprise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: entreprise/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.jobsinc.com/api' }}
      # Vercel deploy via vercel CLI si secrets présents, sinon skip
      - name: Vercel Deploy
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN || true
          vercel build --prod --token=$VERCEL_TOKEN || true
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN || echo "vercel deploy skip"

  deploy-backend:
    name: Deploy Backend (Render)
    runs-on: ubuntu-latest
    if: github.repository == 'JambarrTech/JOBSINC'
    steps:
      - uses: actions/checkout@v4
      # Render auto-deploy via render.yaml si repo connecté — ce job vérifie juste le build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx prisma validate
          node --check server.js
          node --check src/app.js || true
      - name: Trigger Render Deploy Hook (optionnel)
        if: env.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -sf -X POST "$RENDER_DEPLOY_HOOK" && echo "Render hook triggered" || echo "hook skip"

  build-mobile:
    name: Build Mobile APK
    runs-on: ubuntu-latest
    # Le build release échoue désormais EXPLICIEMENT sans android/key.properties
    # (auparavant il retombait silencieusement sur la signature debug, ce qui
    # produisait un APK non publiable sans le moindre signal). Sans le secret,
    # on ne construit que l'APK de debug.
    # KEYSTORE_BASE64 est déclare AU NIVEAU DU JOB et pas du step : le contexte
    # `env` n'est pas résolu pour le `if` d'un step qui définit lui-même sa
    # propre variable. Portée par le seul step, `if: env.KEYSTORE_BASE64 != ''`
    # valait toujours false : la restauration était ignorée et le build
    # retombait silencieusement sur debug — précisément le défaut que ce bloc
    # cherche à éviter.
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Doit rester aligné avec mobile/pubspec.lock (dart >=3.12.0,
          # flutter >=3.44.0) et avec .github/workflows/ci.yml, sinon
          # `flutter pub get` échoue et aucun APK n'est produit.
          flutter-version: '3.47.x'
          cache: true
      - run: flutter pub get
      - name: Restore signing key (release only)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          {
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
            echo "storeFile=../app/release.keystore"
            echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}"
          } > android/key.properties
      - name: Build APK release
        if: env.KEYSTORE_BASE64 != ''
        run: flutter build apk --release --no-pub
      - name: Build APK debug (fallback)
        if: env.KEYSTORE_BASE64 == ''
        run: flutter build apk --debug --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: jobsinc-apk
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
